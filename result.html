<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>シミュレーション結果</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <section class="card">
    <p class="eyebrow">結果</p>
    <h1>あなたの行動記録</h1>
    <p class="warn-text">今の一連の流れは、実際の詐欺・フィッシングでよく使われる手口を再現したものです。</p>
    <div id="result"></div>
    <h2>覚えておきたいこと</h2>
    <ul>
      <li>友達から送られたURLでも、安全とは限りません。</li>
      <li>URLのドメインやリンク先を確認しましょう。</li>
      <li>知らないファイルは、安易にダウンロード・実行しないようにしましょう。</li>
      <li>「急いで」「今だけ」など、焦らせる文面にも注意しましょう。</li>
      <li>突然「ウイルス感染」等を表示する警告は、多くの場合ブラウザ上の偽の演出です。本物のセキュリティソフトは通常ブラウザではなくOSから通知します。</li>
    </ul>
    <button id="reset" class="secondary">もう一度見る</button>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
